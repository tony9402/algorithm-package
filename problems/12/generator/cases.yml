profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          6
          10
          20
          15
          25
          10
          20
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 3, 10, 50, 100, 200, 300]
          item:
            name: "hidden-random-${n}"
            type: generator
            seed: "${n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "random"
