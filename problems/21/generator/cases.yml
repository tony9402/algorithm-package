profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          5 3
          1
          2
          8
          4
          9
  hidden:
    cases:
      - matrix:
          vars:
            n: [2, 3, 5, 10, 1000, 200000]
            mode: ["random", "even", "clustered"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${21000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
      - matrix:
          vars:
            n:
              range:
                from: 10000
                to: 110000
                step: 10000
          item:
            name: "hidden-random-short-interval-${n}"
            type: generator
            seed: "${n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              minV: "${n}"
              maxV: "${(n * 2)}"
              mode: "clustered"
