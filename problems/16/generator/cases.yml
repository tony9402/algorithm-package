profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          2
          10
          15
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 5, 10, 1000, 100000]
            mode: ["random", "equal", "extremes"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${16000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
