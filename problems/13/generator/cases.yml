profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          3 3
          1 3 4
          5 6 7
          8 9 2
      - name: sample-2
        type: fixed
        content: |
          1 6
          10 20 3 4 5 6
      - name: sample-3
        type: fixed
        content: |
          4 4
          20 2 13 1
          4 11 10 35
          3 12 9 7
          30 40 50 5
  hidden:
    cases:
      - matrix:
          vars:
            r: [1, 2, 10, 100, 500]
            c: [1, 3, 25, 100, 500]
          item:
            name: "hidden-random-${r}-${c}"
            type: generator
            seed: "${130000 + r * 1000 + c}"
            args:
              minR: "${r}"
              maxR: "${r}"
              minC: "${c}"
              maxC: "${c}"
              mode: "random"
