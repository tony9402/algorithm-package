profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          7
          20 1
          2 1
          10 3
          100 2
          8 2
          5 20
          50 10
  hidden:
    cases:
      - name: hidden-deadline-slack
        type: fixed
        content: |
          3
          100 2
          99 2
          1 1
      - matrix:
          vars:
            n: [0, 1, 2, 7, 1000, 10000]
            mode: ["random", "same_deadline", "tight_deadlines"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${18000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
