profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          7
          A B C
          B D .
          C E F
          E . .
          F . G
          D . .
          G . .
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 7, 15, 26]
          item:
            name: "hidden-random-${n}"
            type: generator
            seed: "${27000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "random"
      - matrix:
          vars:
            n: [1, 2, 7, 15, 26]
            mode: ["random_pq", "left_chain", "right_chain", "balanced"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${27100 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
