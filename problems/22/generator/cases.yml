profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          8 3
          5 4 2 6 9 3 8 7
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 5, 10, 100, 300]
            mode: ["random", "uniform", "high_values"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${22000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              minM: 1
              maxM: "${n}"
              mode: "${mode}"
