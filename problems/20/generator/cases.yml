profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          5
          4 1 5 2 3
          5
          1 3 7 9 5
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 10, 1000, 100000]
            mode: ["random", "all_hits", "all_misses"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${20000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              minM: "${n}"
              maxM: "${n}"
              mode: "${mode}"
