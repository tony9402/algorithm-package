profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          11
          1 4
          3 5
          0 6
          5 7
          3 8
          5 9
          6 10
          8 11
          8 12
          2 13
          12 14
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 5, 10, 1000, 100000]
            mode: ["random", "touching", "same_end"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${17000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              max_time: "${n + 5}"
              mode: "${mode}"
      - matrix:
          vars:
            max_time:
              range:
                from: 23
                to: 10000
                step: 293
          item:
            name: "hidden-random-max-time-${max_time}"
            type: generator
            seed: 1
            args:
              mode: "random"
              max_time: "${max_time}"
