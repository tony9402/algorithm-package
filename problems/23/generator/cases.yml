profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          4 2
          1 1 1 1
      - name: sample-2
        type: fixed
        content: |
          10 5
          1 2 3 4 2 5 3 1 1 2
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 10, 1000, 10000]
            mode: ["random", "exact", "no_solution"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${23000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
