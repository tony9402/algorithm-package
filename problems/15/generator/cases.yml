profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          4 4
          0100
          0111
          1110
          0010
  hidden:
    cases:
      - matrix:
          vars:
            n: [1, 2, 5, 10, 50, 200]
            mode: ["random", "sparse", "dense", "checkerboard", "full"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              minM: "${n}"
              maxM: "${n}"
              mode: "${mode}"
      - matrix:
          vars:
            n: [1, 3, 30, 300, 1000]
            m: [1, 7, 70, 700, 1000]
          item:
            name: "hidden-rectangle-${n}-${m}"
            type: generator
            seed: "${15000 + n + m}"
            args:
              minN: "${n}"
              maxN: "${n}"
              minM: "${m}"
              maxM: "${m}"
              mode: "random"
