profiles:
  sample:
    cases:
      - name: sample-1
        type: fixed
        content: |
          5 5
          1 3
          1 4
          4 5
          4 3
          3 2
  hidden:
    cases:
      - matrix:
          vars:
            n: [2, 5, 20, 100]
            mode: ["random", "line", "star", "dense"]
          item:
            name: "hidden-${mode}-${n}"
            type: generator
            seed: "${26000 + n}"
            args:
              minN: "${n}"
              maxN: "${n}"
              mode: "${mode}"
